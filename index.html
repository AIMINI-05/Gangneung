<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>강릉 1박 2일 🌊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Serif+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --sea:    #2B6CB0;
    --sea-lt: #4A9FD4;
    --sea-bg: #EBF4FA;
    --sand:   #C9A96E;
    --sand-lt:#F5ECD8;
    --ink:    #1A2B35;
    --muted:  #6B8190;
    --line:   #D9E8F0;
    --card:   #FFFFFF;
    --bg:     #F0F6FA;
    --done:   #B8CDD8;

    --c-ktx:      #2F6E8F;
    --c-bus:      #3E8E84;
    --c-walk:     #8A9CA6;
    --c-meal:     #C5795A;
    --c-activity: #4F93B4;
    --c-stay:     #9A86A8;
    --c-shopping: #BE9B45;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Gowun Dodum', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom, 24px);
  }

  /* ─── HEADER ─────────────────────────── */
  .header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #fff;
    border-bottom: 1px solid var(--line);
    padding: 48px 20px 0;
  }
  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }
  .header-title { flex: 1; min-width: 0; }
  .header-title h1 {
    font-family: 'Noto Serif KR', serif;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--ink);
    line-height: 1.15;
  }
  .header-title .sub {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.01em;
  }
  .header-title .date {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  /* Progress ring */
  .ring-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding-top: 2px;
    flex-shrink: 0;
  }
  .ring-wrap svg { transform: rotate(-90deg); }
  .ring-label { font-size: 9.5px; color: var(--muted); font-weight: 600; }

  /* Day tabs */
  .tabs {
    display: flex;
    gap: 0;
    margin-top: 14px;
    border-bottom: none;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px 0 12px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--muted);
    position: relative;
    letter-spacing: -0.01em;
    transition: color .2s;
  }
  .tab-btn.active { color: var(--sea); }
  .tab-btn.active::after {
    content: '';
    position: absolute;
    left: 8px; right: 8px; bottom: 0;
    height: 2.5px;
    background: var(--sea);
    border-radius: 2px;
  }
  .tab-date {
    display: block;
    font-size: 10.5px;
    font-weight: 400;
    color: inherit;
    opacity: 0.75;
    margin-top: 1px;
  }

  /* ─── TIMELINE ────────────────────────── */
  .timeline { padding: 18px 16px 32px; }

  /* Section header */
  .section-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 24px 0 12px;
  }
  .section-row:first-child { margin-top: 0; }
  .section-dot {
    width: 36px;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .section-dot span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #BDD4DE;
    display: block;
  }
  .section-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--sea);
    text-transform: uppercase;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .section-line {
    flex: 1;
    height: 1px;
    background: var(--line);
  }

  /* Move row */
  .move-row { display: flex; min-height: 40px; }
  .move-gutter {
    width: 36px;
    position: relative;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .move-gutter::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 0;
    border-left: 2px dashed #CDD9E0;
    transform: translateX(-50%);
  }
  .move-icon-wrap {
    position: relative;
    margin-top: 8px;
    width: 22px; height: 22px;
    border-radius: 11px;
    background: var(--bg);
    border: 1.5px solid #CDD9E0;
    color: var(--muted);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .move-body {
    flex: 1;
    padding: 7px 0 7px 10px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.55;
  }
  .move-body strong { color: #5E727B; font-weight: 600; }

  /* Stop row */
  .stop-row { display: flex; min-height: 52px; }
  .stop-gutter {
    width: 36px;
    position: relative;
    display: flex;
    justify-content: center;
    flex-shrink: 0;
  }
  .stop-gutter::before {
    content: '';
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 0;
    border-left: 2px solid var(--line);
    transform: translateX(-50%);
  }
  .stop-node {
    position: relative;
    margin-top: 4px;
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color .2s, box-shadow .2s;
    flex-shrink: 0;
  }
  .stop-node.is-now {
    border-color: var(--node-color);
    box-shadow: 0 0 0 4px color-mix(in srgb, var(--node-color) 20%, transparent);
  }
  .stop-node.done {
    border-color: #D0DDE4;
    background: #F6F9FB;
  }
  .stop-node svg { transition: color .2s; }

  .stop-card {
    flex: 1;
    min-width: 0;
    margin-bottom: 10px;
    padding: 11px 12px 11px 12px;
    background: #fff;
    border: 1px solid #EAF0F2;
    border-radius: 14px;
    cursor: pointer;
    transition: all .18s;
    margin-left: 8px;
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }
  .stop-card.is-now {
    background: #EEF5F8;
    border-color: #C0DCE8;
  }
  .stop-card.done { opacity: 0.52; }
  .stop-card:active { transform: scale(0.988); }

  .stop-content { flex: 1; min-width: 0; }
  .stop-time {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.01em;
    margin-bottom: 1px;
  }
  .stop-title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .stop-note {
    font-size: 12px;
    color: var(--muted);
    line-height: 1.5;
  }
  .naver-link {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    margin-top: 8px;
    font-size: 12px;
    font-weight: 700;
    color: var(--sea);
    text-decoration: none;
    padding: 5px 9px;
    background: var(--sea-bg);
    border-radius: 20px;
    transition: opacity .15s;
  }
  .naver-link:active { opacity: 0.6; }

  /* Check button */
  .check-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 2px solid var(--line);
    background: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: all .18s;
    color: transparent;
    margin-top: 2px;
  }
  .check-btn.checked {
    border-color: var(--sea);
    background: var(--sea);
    color: #fff;
  }

  /* Now badge */
  .now-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 800;
    color: #fff;
    padding: 2px 7px;
    border-radius: 20px;
    vertical-align: middle;
    margin-left: 6px;
    letter-spacing: 0.04em;
  }

  /* Tips section */
  .tips-section {
    margin: 8px 16px 0;
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--line);
    background: #fff;
  }
  .tips-toggle {
    width: 100%;
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--ink);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    letter-spacing: -0.01em;
  }
  .tips-body { padding: 0 16px 14px; display: none; }
  .tips-body.open { display: block; }
  .tip-item { margin-top: 12px; }
  .tip-title { font-size: 12.5px; font-weight: 700; color: var(--sea); margin-bottom: 2px; }
  .tip-desc { font-size: 12px; color: var(--muted); line-height: 1.55; }

  /* Last stop — hide vertical line below */
  .stop-row:last-child .stop-gutter::before,
  .move-row:last-child .move-gutter::before { display: none; }

  /* Pulse animation */
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(43,108,176,0); }
    50%       { box-shadow: 0 0 0 5px rgba(43,108,176,0.18); }
  }
  .is-now .stop-node { animation: pulse 2.2s ease-in-out infinite; }

  /* Progress text in ring */
  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .ring-pct { font-size: 12px; font-weight: 800; color: var(--ink); }
  .ring-symbol { font-size: 7.5px; font-weight: 700; color: var(--muted); margin-top: 1px; }
</style>
</head>
<body>

<div class="header" id="header">
  <div class="header-top">
    <div class="header-title">
      <h1>강릉 여행</h1>
      <div class="sub">1박 2일 · 로맨스 인강문</div>
      <div class="date">2025. 6. 12 금 — 6. 13 토</div>
    </div>
    <div class="ring-wrap">
      <div style="position:relative;width:46px;height:46px;">
        <svg width="46" height="46" viewBox="0 0 46 46">
          <circle cx="23" cy="23" r="15.5" fill="none" stroke="#DCEAF0" stroke-width="4"/>
          <circle id="ring-fill" cx="23" cy="23" r="15.5" fill="none" stroke="var(--sea)" stroke-width="4"
            stroke-linecap="round" stroke-dasharray="97.4" stroke-dashoffset="97.4"
            style="transition:stroke-dashoffset .4s"/>
        </svg>

      </div>
      <div class="ring-label" id="ring-count">0/0</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" id="tab-1" onclick="switchDay(1)">
      Day 1 <span class="tab-date">6/12 금</span>
    </button>
    <button class="tab-btn" id="tab-2" onclick="switchDay(2)">
      Day 2 <span class="tab-date">6/13 토</span>
    </button>
  </div>
</div>

<div class="timeline" id="timeline"></div>

<div class="tips-section">
  <button class="tips-toggle" onclick="toggleTips(this)">
    <span>💡 여행 팁</span>
    <span id="tips-arrow">▾</span>
  </button>
  <div class="tips-body" id="tips-body">
    <div class="tip-item">
      <div class="tip-title">버스 실시간 조회</div>
      <div class="tip-desc">202번 배차 26~52분. 네이버맵 또는 강릉BIS앱(bis.gn.go.kr)으로 실시간 확인.</div>
    </div>
    <div class="tip-item">
      <div class="tip-title">아이스백 챙기기</div>
      <div class="tip-desc">중앙시장 야식거리는 체크인 전까지 들고 다녀야 하니 아이스백·보냉백 필수.</div>
    </div>
    <div class="tip-item">
      <div class="tip-title">강릉샌드 타이밍</div>
      <div class="tip-desc">숙소 바로 앞이라 체크아웃 직후 바로 구매 가능.</div>
    </div>
  </div>
</div>

<div style="height: 32px;"></div>

<script>
// ─── DATA ─────────────────────────────────────
const CAT = {
  ktx:      { name: 'KTX',  color: '#2F6E8F' },
  bus:      { name: '버스',  color: '#3E8E84' },
  walk:     { name: '도보',  color: '#8A9CA6' },
  meal:     { name: '식사',  color: '#C5795A' },
  activity: { name: '여유',  color: '#4F93B4' },
  stay:     { name: '숙소',  color: '#9A86A8' },
  shopping: { name: '쇼핑',  color: '#BE9B45' },
};

// Naver map links provided by user
const NAVER = {
  '강릉역':          'https://naver.me/5kksyhHR',
  '초당순두부마을':  'https://naver.me/5z52o6m3',
  '서울역':          'https://naver.me/GyNv7dGv',
  '숙소':            'https://naver.me/5v3bERXU',
  '순두부젤라또':    'https://naver.me/F2ZuxpbU',
  '강릉중앙시장':    'https://naver.me/GSDAku3c',
  '경포호':          'https://naver.me/xVBxJvVp',
  '바닷가':          'https://naver.me/xAFCxm1E',
};

const TRIP = {
  days: [
    {
      id: 1,
      items: [
        { type: 'section', label: '서울 출발' },
        { type: 'stop', id: 'd1-seoul-out', timeLabel: '09:55', title: '서울역 출발', note: 'KTX · 강릉행', cat: 'ktx', naverKey: '서울역' },
        { type: 'stop', id: 'd1-gn-in',    timeLabel: '11:58', title: '강릉역 도착',  note: '약 2시간 소요',      cat: 'ktx', naverKey: '강릉역' },

        { type: 'section', label: '점심 & 쇼핑' },
        { type: 'move', mode: 'walk', from: '강릉역', to: '강릉 중앙시장', dur: '약 5분' },
        { type: 'stop', id: 'd1-market', timeLabel: '12:10 – 14:00', title: '강릉 중앙시장', note: '점심 식사 후 시네마룸 야식거리 장보기', cat: 'meal', naverKey: '강릉중앙시장' },

        { type: 'section', label: '바다로' },
        { type: 'move', mode: 'bus', line: '202번', from: '강릉역 건너편', to: '경포해변 방향', dur: '약 30분 · 배차 26~52분' },
        { type: 'stop', id: 'd1-feet', timeLabel: '14:30 – 15:00', title: '바닷가 발 담그기', note: '경포해변 · 잠깐 들러 발만 담그기', cat: 'activity', naverKey: '바닷가' },

        { type: 'section', label: '체크인' },
        { type: 'move', mode: 'walk', from: '경포해변', to: '로맨스 인강문', dur: '약 10분' },
        { type: 'stop', id: 'd1-checkin', timeLabel: '15:10',          title: '체크인 · 로맨스 인강문', note: '시네마룸 · 체크인 15:00', cat: 'stay', naverKey: '숙소' },
        { type: 'stop', id: 'd1-rest',    timeLabel: '15:10 – 15:40',  title: '짐 정리 & 휴식',          note: '잠깐 쉬고 나가기',             cat: 'stay' },
        { type: 'stop', id: 'd1-pool',    timeLabel: '15:40 – 18:00',  title: '호텔 수영장',              note: '운영 15:00–20:00 · 체크아웃 후 이용 불가', cat: 'activity' },

        { type: 'section', label: '저녁' },
        { type: 'move', mode: 'walk', from: '숙소', to: '바닷가 카페', dur: '5분 이내' },
        { type: 'stop', id: 'd1-cafe',   timeLabel: '18:00 – 19:30', title: '바닷가 카페',  note: '석양 보며 여유 · 강문·경포해변 일대 (미정)', cat: 'activity' },
        { type: 'stop', id: 'd1-dinner', timeLabel: '19:30 – 20:30', title: '저녁 식사',    note: '숙소 근처 (미정)', cat: 'meal' },
        { type: 'stop', id: 'd1-movie',  timeLabel: '21:00 ~',       title: '시네마룸 영화 + 야식', note: '시장에서 사온 야식으로', cat: 'activity' },
      ],
    },
    {
      id: 2,
      items: [
        { type: 'section', label: '오전 루틴' },
        { type: 'stop', id: 'd2-run',  timeLabel: '07:00 – 08:30', title: '아침 러닝', note: '경포 둘레길 · 숙소에서 도보 진입', cat: 'activity', naverKey: '경포호' },
        { type: 'stop', id: 'd2-prep', timeLabel: '08:30 – 11:00', title: '씻고 짐 챙기고 화장', note: '샤워 + 짐 정리 + 화장 · 체크아웃 준비', cat: 'stay' },

        { type: 'section', label: '체크아웃' },
        { type: 'stop', id: 'd2-checkout', timeLabel: '11:00', title: '체크아웃', note: '로맨스 인강문 · 체크아웃 11:00', cat: 'stay', naverKey: '숙소' },
        { type: 'stop', id: 'd2-sand', timeLabel: '11:00 – 11:10', title: '강릉샌드 구매', note: '숙소 바로 앞', cat: 'shopping' },

        { type: 'section', label: '초당마을' },
        { type: 'move', mode: 'walk', from: '숙소', to: '초당마을', dur: '약 15분' },
        { type: 'stop', id: 'd2-sundubu', timeLabel: '11:30 – 13:00', title: '초당 순두부찌개 점심', note: '식당 확정 예정', cat: 'meal', naverKey: '초당순두부마을' },
        { type: 'stop', id: 'd2-gelato',  timeLabel: '13:00 – 13:20', title: '순두부 젤라또', note: '초당순두부길 95-5 · 점심 후 디저트', cat: 'meal', naverKey: '순두부젤라또' },

        { type: 'section', label: '마지막 바다' },
        { type: 'move', mode: 'walk', from: '식당', to: '바닷가 카페', dur: '도보권' },
        { type: 'stop', id: 'd2-cafe', timeLabel: '12:30 – 14:00', title: '바닷가 카페', note: '여유롭게 마지막 바다뷰 (미정)', cat: 'activity' },

        { type: 'section', label: '귀경' },
        { type: 'move', mode: 'bus', line: '202-1번', from: '강문해변 입구', to: '강릉역 하차', dur: '약 15~20분' },
        { type: 'stop', id: 'd2-wait',     timeLabel: '14:30 – 17:00', title: '강릉역 대기 / 여유', note: '역 근처 카페 or 대합실', cat: 'activity', naverKey: '강릉역' },
        { type: 'stop', id: 'd2-gn-out',   timeLabel: '17:01',          title: '강릉역 출발',         note: 'KTX · 서울행',           cat: 'ktx', naverKey: '강릉역' },
        { type: 'stop', id: 'd2-seoul-in', timeLabel: '19:13',          title: '서울역 도착',          note: '여행 끝 · 수고했어요 🥳', cat: 'ktx', naverKey: '서울역' },
      ],
    },
  ],
};

TRIP.allStopIds = TRIP.days.flatMap(d => d.items.filter(i => i.type === 'stop').map(i => i.id));

// ─── STATE ────────────────────────────────────
const STORE_KEY = 'gn-trip-2025-checks';
let checked = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
let currentDay = 1;

function saveChecked() { localStorage.setItem(STORE_KEY, JSON.stringify(checked)); }
function toggleCheck(id) {
  checked[id] = !checked[id];
  saveChecked();
  render();
  updateProgress();
}

// ─── ICONS ────────────────────────────────────
function icon(cat, size = 17) {
  const s = `width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"`;
  switch(cat) {
    case 'ktx': return `<svg ${s}><rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10.5h14"/><circle cx="9" cy="6.8" r="0.6" fill="currentColor" stroke="none"/><circle cx="15" cy="6.8" r="0.6" fill="currentColor" stroke="none"/><path d="M8 16l-2 4M16 16l2 4"/></svg>`;
    case 'bus': return `<svg ${s}><rect x="4" y="3.5" width="16" height="13" rx="3"/><path d="M4 10.5h16"/><path d="M7 16.5v2M17 16.5v2"/><circle cx="8" cy="13.5" r="0.6" fill="currentColor" stroke="none"/><circle cx="16" cy="13.5" r="0.6" fill="currentColor" stroke="none"/></svg>`;
    case 'walk': return `<svg ${s}><circle cx="13" cy="4" r="1.8"/><path d="M13 7.5l-1.5 5 2.5 1.8 1 5.7"/><path d="M11.5 12.5L8 14"/><path d="M13 9l3 1.5 1.5-1.2"/><path d="M11.5 12.5L9.5 20"/></svg>`;
    case 'meal': return `<svg ${s}><path d="M8 3v18"/><path d="M6 3v4a2 2 0 0 0 4 0V3"/><path d="M16.5 3c-1.6 0-2.5 2.2-2.5 5.2 0 2.4 1 3.6 2.5 3.8"/><path d="M16.5 12v9"/></svg>`;
    case 'activity': return `<svg ${s}><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.2 5.2l1.5 1.5M17.3 17.3l1.5 1.5M18.8 5.2l-1.5 1.5M6.7 17.3l-1.5 1.5"/></svg>`;
    case 'stay': return `<svg ${s}><path d="M2.5 18.5V7.5"/><path d="M2.5 12.5h14a4 4 0 0 1 4 4v2"/><path d="M2.5 18.5h18.5"/><path d="M6.5 12.5v-2a1.5 1.5 0 0 1 1.5-1.5h3a1.5 1.5 0 0 1 1.5 1.5v2"/></svg>`;
    case 'shopping': return `<svg ${s}><path d="M6.5 8h11l-1 12.5h-9L6.5 8z"/><path d="M9.2 8V6.2a2.8 2.8 0 0 1 5.6 0V8"/></svg>`;
    default: return '';
  }
}

const checkSvg = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`;
const mapPinSvg = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.7-6-10a6 6 0 0 1 12 0c0 4.3-6 10-6 10z"/><circle cx="12" cy="11" r="2"/></svg>`;

// ─── PROGRESS ─────────────────────────────────
function updateProgress() {
  const total = TRIP.allStopIds.length;
  const done  = TRIP.allStopIds.filter(id => checked[id]).length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  const circ  = 2 * Math.PI * 15.5;
  const offset = circ * (1 - pct / 100);
  document.getElementById('ring-fill').style.strokeDashoffset = offset;
  document.getElementById('ring-count').textContent = `${done}/${total}`;
}

// ─── RENDER ───────────────────────────────────
function render() {
  const d = TRIP.days[currentDay - 1];
  const tl = document.getElementById('timeline');
  let html = '';

  d.items.forEach((it, i) => {
    if (it.type === 'section') {
      html += `
        <div class="section-row">
          <div class="section-dot"><span></span></div>
          <span class="section-label">${it.label}</span>
          <div class="section-line"></div>
        </div>`;
      return;
    }

    if (it.type === 'move') {
      const modeName = CAT[it.mode]?.name || it.mode;
      html += `
        <div class="move-row">
          <div class="move-gutter">
            <div class="move-icon-wrap">${icon(it.mode, 12)}</div>
          </div>
          <div class="move-body">
            <strong>${modeName}${it.line ? ' ' + it.line : ''}</strong>　${it.from} → ${it.to}<br>
            <span>${it.dur}</span>
          </div>
        </div>`;
      return;
    }

    // stop
    const c = CAT[it.cat] || { color: '#888' };
    const isDone = !!checked[it.id];
    const naverUrl = it.naverKey ? NAVER[it.naverKey] : null;

    html += `
      <div class="stop-row ${isDone ? 'done-row' : ''}">
        <div class="stop-gutter">
          <div class="stop-node ${isDone ? 'done' : ''}" style="--node-color:${c.color}; color:${isDone ? '#B7C3C9' : c.color};">
            ${icon(it.cat, 15)}
          </div>
        </div>
        <div class="stop-card ${isDone ? 'done' : ''}" onclick="toggleCheck('${it.id}')">
          <div class="stop-content">
            <div class="stop-time" style="color:${c.color}">${it.timeLabel}</div>
            <div class="stop-title">${it.title}</div>
            <div class="stop-note">${it.note}</div>
            ${naverUrl ? `<a class="naver-link" href="${naverUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${mapPinSvg} 네이버지도</a>` : ''}
          </div>
          <button class="check-btn ${isDone ? 'checked' : ''}" onclick="event.stopPropagation(); toggleCheck('${it.id}')" aria-label="완료 체크">
            ${isDone ? checkSvg : ''}
          </button>
        </div>
      </div>`;
  });

  tl.innerHTML = html;
}

// ─── DAY SWITCH ───────────────────────────────
function switchDay(d) {
  currentDay = d;
  document.getElementById('tab-1').className = 'tab-btn' + (d === 1 ? ' active' : '');
  document.getElementById('tab-2').className = 'tab-btn' + (d === 2 ? ' active' : '');
  render();
}

// ─── TIPS TOGGLE ──────────────────────────────
function toggleTips(btn) {
  const body = document.getElementById('tips-body');
  const arrow = document.getElementById('tips-arrow');
  const open = body.classList.toggle('open');
  arrow.textContent = open ? '▴' : '▾';
}

// ─── INIT ─────────────────────────────────────
render();
updateProgress();
</script>
</body>
</html>
